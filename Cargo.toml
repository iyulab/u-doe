[package]
name = "u-doe"
version = "0.11.0"
rust-version = "1.85"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "Design of Experiments (DOE) framework: factorial, Plackett-Burman, CCD, Box-Behnken, Taguchi, effects analysis, RSM, and desirability optimization."
repository = "https://github.com/iyulab/u-doe"
keywords = ["doe", "experimental-design", "rsm", "factorial", "statistics"]
categories = ["science", "mathematics"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde_json", "dep:serde"]

[dependencies]
u-numflow = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = { version = "1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1.0"

# `getrandom` is named nowhere in the source: it is declared only to turn on its
# `wasm_js` backend for wasm32, which `rand` needs to build there.
[package.metadata.cargo-machete]
ignored = ["getrandom"]
