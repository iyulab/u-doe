name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'src/wasm.rs'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # Not 'latest': the action resolves that at run time and silently falls
          # back to v0.9.1 when the lookup fails, which predates `--features` and
          # fails the build below. Two runs three minutes apart got v0.15.0 and
          # v0.9.1 from the same pinned action.
          version: 'v0.15.0'

      - name: Build WASM package (bundler + nodejs)
        run: |
          wasm-pack build --target bundler --scope iyulab --out-dir pkg --features wasm
          wasm-pack build --target nodejs --scope iyulab --out-dir pkg-node --features wasm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Merge nodejs target (node-compatible entry via exports map)
        run: |
          NAME=$(node -p "require('./pkg/package.json').main.slice(0,-3)")
          mkdir -p pkg/node
          cp "pkg-node/${NAME}.js" "pkg/node/${NAME}.cjs"
          cp "pkg-node/${NAME}_bg.wasm" pkg/node/
          cp "pkg-node/${NAME}.d.ts" "pkg/node/${NAME}.d.cts"
          sed -i "s|@ts-self-types=\"./${NAME}.d.ts\"|@ts-self-types=\"./${NAME}.d.cts\"|" "pkg/node/${NAME}.cjs"
          node <<'EOF'
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("pkg/package.json", "utf8"));
          const n = p.main.slice(0, -3);
          p.exports = { ".": {
            node: { types: `./node/${n}.d.cts`, default: `./node/${n}.cjs` },
            types: `./${n}.d.ts`,
            default: `./${n}.js`,
          } };
          p.exports["./package.json"] = "./package.json";
          if (!p.files.includes("node")) p.files.push("node");
          p.sideEffects = [...(p.sideEffects || []), `./node/${n}.cjs`];
          fs.writeFileSync("pkg/package.json", JSON.stringify(p, null, 2) + "\n");
          EOF

      - name: Node smoke test (CJS require + ESM import)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/pkg"
          node -e "const m = require('$PKG_NAME'); if (!Object.keys(m).length) throw new Error('empty CJS exports')"
          node --input-type=module -e "import('$PKG_NAME').then(m => { if (!Object.keys(m).length) throw new Error('empty ESM exports') })"

      # The step above proves the package loads, not that any binding answers
      # with the documented shape. The host-target tests never build a JS
      # `Error` and serialize with serde_json, so what is only observable here
      # is whether a refusal arrives as an `Error` carrying `code` and its
      # fields, and an absent value as `null` rather than `undefined` or `NaN`.
      # This is the last gate before `npm publish`.
      - name: Node behaviour gate (errors and absent values)
        run: |
          PKG_NAME=$(node -p "require('./pkg/package.json').name")
          cd "$RUNNER_TEMP/smoke"
          cat > gate.mjs <<'EOF'
          const m = await import(process.env.PKG_NAME)
          const ok = (c, msg) => { if (!c) throw new Error(msg) }
          const refusal = (f) => { try { f() } catch (e) { return e } return null }

          // A refusal is an Error with a stable code and the values behind it.
          const pb = m.plackett_burman(7)
          let e = refusal(() => m.fit_least_squares(pb.data.slice(1), [1, 2, 3, 4, 5, 6, 7], pb.factor_names, pb.factor_names))
          ok(e instanceof Error, 'a refusal must be an Error')
          ok(e.code === 'over_specified_model' && e.terms === 7 && e.runs === 7, `code=${e.code} terms=${e.terms} runs=${e.runs}`)
          ok(typeof e.message === 'string' && e.message.includes('degrees of freedom'), `message=${e.message}`)

          const f3 = m.full_factorial(3)
          e = refusal(() => m.fit_least_squares(f3.data.filter((r) => r[2] > 0), [1, 2, 3, 5], f3.factor_names, f3.factor_names))
          ok(e.code === 'aliased_effects' && e.first === 'C' && e.second === 'I', `code=${e.code} first=${e.first} second=${e.second}`)

          e = refusal(() => m.fractional_factorial(4, 2))
          const table = m.standard_fractions()
          ok(e.code === 'unsupported_fraction' && JSON.stringify(e.supported) === JSON.stringify(table.map((t) => [t.k, t.p])),
            'unsupported_fraction must list the table standard_fractions() returns')

          const spec = (goal, lower, target, upper) => ({ goal, lower, target, upper, s1: 1, s2: 1 })
          e = refusal(() => m.desirability([spec('Maximize', 0, 10, 10), spec('Target', 10, 5, 0)], [5, 5]))
          ok(e.code === 'invalid_desirability_limits' && e.index === 1 && e.goal === 'Target', `code=${e.code} index=${e.index}`)

          e = refusal(() => m.two_level_factorial_power(3, 0, 1, 1, 1, 2))
          ok(e.code === 'value_out_of_domain' && e.parameter === 'alpha', `code=${e.code} parameter=${e.parameter}`)

          // Inputs that once trapped the module are refused like any other.
          e = refusal(() => m.fit_rsm([], [], []))
          ok(e instanceof Error && e.code === 'empty_design', `fit_rsm([]): ${e}`)
          ok(typeof m.full_factorial(2).run_count === 'number', 'the module must still answer after a refusal')

          // A fitted surface can be evaluated, and says what its coefficients are.
          // The oracle is worked by hand: k=2, coded (0.5, -1),
          // row [1, 0.5, -1, 0.25, 1, -0.5] . [10, 2, -3, -1.5, 0.5, 4] = 12.125
          const rsmC = [10, 2, -3, -1.5, 0.5, 4]
          const p1 = m.rsm_predict(rsmC, 2, Float64Array.from([0.5, -1]))
          ok(p1.length === 1 && Math.abs(p1[0] - 12.125) < 1e-12, `rsm_predict: ${p1}`)
          const pN = m.rsm_predict(rsmC, 2, Float64Array.from([0.5, -1, 0, 0, 1, 1]))
          ok(pN.length === 3 && Math.abs(pN[1] - 10) < 1e-12, `rsm_predict batched: ${pN}`)
          e = refusal(() => m.rsm_predict(rsmC, 2, Float64Array.from([0.5])))
          ok(e.code === 'point_dimension_mismatch', `ragged coded: ${e.code}`)
          e = refusal(() => m.rsm_predict([1, 2, 3], 2, Float64Array.from([0, 0])))
          ok(e.code === 'coefficient_count_mismatch', `wrong coefficient count: ${e.code}`)

          // An absent value is null, with its key present.
          const f2 = m.full_factorial(2)
          const sat = m.doe_anova(f2.data, [1, 2, 3, 5], f2.factor_names, ['A', 'B', 'A:B'])
          ok('curvature' in sat && sat.curvature === null, 'curvature must be null')
          ok(sat.effects.every((r) => r.f_statistic === null && r.p_value === null), 'a saturated F and p must be null, not NaN')
          const fx = m.estimate_effects(f2.data, [1, 2, 3, 5], f2.factor_names, 1)
          ok('lenth' in fx && fx.lenth === null, 'lenth must be null with two contrasts')

          console.log('binding behaviour gate: ok')
          EOF
          PKG_NAME="$PKG_NAME" node gate.mjs

      - name: Publish to npm
        run: |
          cd pkg
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VER}" version 2>/dev/null; then
            echo "Version ${PKG_VER} already published, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
